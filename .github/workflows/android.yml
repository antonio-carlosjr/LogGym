name: Android CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build e testes unitários
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # Cache do Gradle e validação do checksum do gradle-wrapper.jar.
      - uses: gradle/actions/setup-gradle@v6

      # O runner já tem o Android SDK. O AGP baixa a platform 37 se ela não estiver instalada.
      - name: Build e testes
        run: ./gradlew assembleDebug testDebugUnitTest --console=plain

      - name: Publicar relatórios de teste
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 7
